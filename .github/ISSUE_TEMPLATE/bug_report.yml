name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command line, and a few lines of the input if it is a streaming or replay problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, compiler and version, phone and streaming app (if relevant).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Terminal output or error messages.
      render: text
