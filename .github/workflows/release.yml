name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIMU_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="imu-kalman-attitude-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp build/imu_attitude README.md LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS && cd ..
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $version"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
