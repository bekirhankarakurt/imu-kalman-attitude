name: Docs and coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gcovr
        run: pip install gcovr
      - name: Build with coverage
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage -O0"
          cmake --build build-cov -j
      - name: Run tests
        run: ctest --test-dir build-cov --output-on-failure
      - name: Report
        run: |
          mkdir -p site/coverage
          gcovr --root . --filter 'src/' --filter 'include/' --exclude 'src/main.cpp' \
            --print-summary --html-details site/coverage/index.html --json-summary summary.json
          python3 - <<'PY'
          import json
          pct = json.load(open("summary.json"))["line_percent"]
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else "yellow" if pct >= 70 else "orange"
          json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color},
                    open("site/coverage.json", "w"))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-site
          path: site

  docs:
    name: API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Build docs
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile
          mkdir -p site
          mv build/doxygen/html site/api
      - uses: actions/upload-artifact@v7
        with:
          name: api-site
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: [coverage, docs]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: parts
          merge-multiple: true
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r parts/. site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>imu-kalman-attitude</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}</style>
          <h1>imu-kalman-attitude</h1>
          <ul>
            <li><a href="api/">API documentation (Doxygen)</a></li>
            <li><a href="coverage/">Test coverage report</a></li>
            <li><a href="https://github.com/bekirhankarakurt/imu-kalman-attitude">Source on GitHub</a></li>
          </ul>
          HTML
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
